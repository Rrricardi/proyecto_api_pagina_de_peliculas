<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CARTELERA — Catálogo de Series</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="marquee-lights" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">CARTELERA</span>
        <span class="brand-sub">Catálogo digital de series</span>
      </div>
      <div class="showtime" id="showtime">
        <span class="showtime-label">Función</span>
        <span class="showtime-value" id="clock">--:--</span>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <h1 class="hero-title">Hoy en cartelera</h1>
      <p class="hero-copy">
        Explora el catálogo alimentado en vivo por <strong>TVMaze</strong>.
        Cada función es una página distinta: recorre la fila de butacas para ver más títulos.
      </p>
    </section>

    <section class="search-row">
      <form class="search-box" id="searchForm" role="search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Buscar series por título…"
          aria-label="Buscar series por título"
          autocomplete="off"
        />
        <button type="button" id="searchClear" class="search-clear" aria-label="Limpiar búsqueda" hidden>✕</button>
      </form>
    </section>

    <section class="status-row" id="statusRow" aria-live="polite">
      <span id="statusText">Preparando la sala…</span>
    </section>

    <section class="grid" id="cardsGrid" aria-live="polite">
      <!-- Las tarjetas se insertan dinámicamente desde js/cards.js -->
    </section>

    <nav class="pagination" id="pagination" aria-label="Paginación del catálogo">
      <!-- Los controles de paginación se insertan desde js/pagination.js -->
    </nav>
  </main>

  <footer class="site-footer">
    <div class="perforation" aria-hidden="true"></div>
    <p>Datos servidos por la API pública de <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVMaze</a></p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
